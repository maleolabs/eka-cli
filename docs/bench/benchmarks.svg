<svg xmlns="http://www.w3.org/2000/svg" width="760" height="406" viewBox="0 0 760 406" role="img" aria-label="eka-cli latency per scenario">
  <title>eka-cli latency: best of 5 runs, milliseconds</title>
  <desc>Measured on Intel(R) Core(TM) i7-8550U CPU @ 1.80GHz.</desc>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">
