    <rect x="210" y="296" width="69" height="20" rx="3" fill="#5fafff"/>
    <text x="582" y="310" fill="#8a8a8a">48</text>
    <text x="0" y="350" fill="#8a8a8a">code-discover</text>
    <rect x="210" y="336" width="360" height="20" rx="3" fill="#8a8a8a" opacity="0.14"/>
    <rect x="210" y="336" width="67" height="20" rx="3" fill="#5fafff"/>
    <text x="582" y="350" fill="#8a8a8a">47</text>
    <text x="0" y="396" fill="#8a8a8a" opacity="0.8">cold code index (amber) vs everything else</text>
