    <rect x="210" y="56" width="360" height="20" rx="3" fill="#8a8a8a" opacity="0.14"/>
    <rect x="210" y="56" width="28" height="20" rx="3" fill="#5fafff"/>
    <text x="582" y="70" fill="#8a8a8a">19</text>
    <text x="0" y="110" fill="#8a8a8a">validate</text>
    <rect x="210" y="96" width="360" height="20" rx="3" fill="#8a8a8a" opacity="0.14"/>
    <rect x="210" y="96" width="43" height="20" rx="3" fill="#5fafff"/>
    <text x="582" y="110" fill="#8a8a8a">30</text>
    <text x="0" y="150" fill="#8a8a8a">sync</text>
    <rect x="210" y="136" width="360" height="20" rx="3" fill="#8a8a8a" opacity="0.14"/>
    <rect x="210" y="136" width="74" height="20" rx="3" fill="#5fafff"/>
    <text x="582" y="150" fill="#8a8a8a">52</text>
    <text x="0" y="190" fill="#8a8a8a">view-execution</text>
    <rect x="210" y="176" width="360" height="20" rx="3" fill="#8a8a8a" opacity="0.14"/>
    <rect x="210" y="176" width="42" height="20" rx="3" fill="#5fafff"/>
    <text x="582" y="190" fill="#8a8a8a">29</text>
    <text x="0" y="230" fill="#8a8a8a">status</text>
    <rect x="210" y="216" width="360" height="20" rx="3" fill="#8a8a8a" opacity="0.14"/>
    <rect x="210" y="216" width="53" height="20" rx="3" fill="#5fafff"/>
    <text x="582" y="230" fill="#8a8a8a">37</text>
    <text x="0" y="270" fill="#8a8a8a">code-context-cold</text>
    <rect x="210" y="256" width="360" height="20" rx="3" fill="#8a8a8a" opacity="0.14"/>
    <rect x="210" y="256" width="360" height="20" rx="3" fill="#ffaf5f"/>
    <text x="582" y="270" fill="#8a8a8a">253</text>
